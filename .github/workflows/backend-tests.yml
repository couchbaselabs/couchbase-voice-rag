name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install libmagic (python-magic dependency)
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Resolve dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest -q
        env:
          JWT_SECRET: ci-test-secret-at-least-32-characters-long

      - name: Regenerate openapi.json
        run: uv run python scripts/dump_openapi.py
        env:
          JWT_SECRET: ci-test-secret-at-least-32-characters-long

      - name: Check openapi.json is in sync
        run: git diff --exit-code openapi.json
